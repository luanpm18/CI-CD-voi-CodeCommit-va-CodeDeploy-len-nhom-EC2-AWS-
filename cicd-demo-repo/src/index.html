<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>CI/CD Demo - Version 2</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 60px;
      background-color: #1e3a5f;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      max-width: 500px;
    }
    h1 { color: #1e3a5f; margin-bottom: 15px; }
    .version-badge {
      background: #1e3a5f;
      color: white;
      font-size: 0.85rem;
      font-weight: bold;
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .status {
      color: #16a34a;
      font-weight: bold;
      font-size: 1.25rem;
      background: #dcfce7;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
    }
    .info { color: #4b5563; margin-top: 20px; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Tiêu đề hiển thị phiên bản hiện tại (Version 2) -->
    <div class="version-badge">VERSION 2</div>
    <h1>CI/CD Demo - Version 2</h1>

    <!-- DÒNG TRẠNG THÁI CỰC KỲ QUAN TRỌNG: -->
    <!-- Script 'validate_service.sh' sẽ dùng lệnh curl quét tìm chuỗi 'STATUS: healthy' này. -->
    <!-- Nếu tìm thấy dòng này, hook ValidateService mới báo thành công (exit 0). -->
    <p class="status">STATUS: healthy</p>

    <p class="info">Triển khai thành công lên cụm EC2 bằng AWS CodeDeploy!</p>
  </div>
</body>
</html>
